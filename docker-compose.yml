version: "3.9"

services:
  # ─── FalkorDB (Knowledge Graph + Graphiti) ─────────────────────────
  falkordb:
    image: falkordb/falkordb:latest
    container_name: l1_falkordb
    ports:
      - "6381:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (Session Cache / Working Memory) ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: l1_redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Postgres + pgvector (Vector Search + App Data) ─────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: l1_postgres
    environment:
      POSTGRES_DB: l1_support
      POSTGRES_USER: l1support
      POSTGRES_PASSWORD: l1support_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U l1support -d l1_support"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Chatwoot (Chat Frontend / Unified Inbox) ───────────────────────
  chatwoot_rails:
    image: chatwoot/chatwoot:latest
    container_name: l1_chatwoot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: l1support_chatwoot_secret_change_in_prod
      DATABASE_URL: postgresql://l1support:l1support_secret@postgres:5432/l1_support
      REDIS_URL: redis://redis:6379/1
      FRONTEND_URL: http://localhost:3000
      ACTIVE_STORAGE_SERVICE: local
    ports:
      - "3000:3000"
    volumes:
      - chatwoot_storage:/app/storage
    command: /bin/sh -c "bundle exec rails db:prepare && bundle exec rails s -p 3000 -b 0.0.0.0"

  chatwoot_worker:
    image: chatwoot/chatwoot:latest
    container_name: l1_chatwoot_worker
    depends_on:
      - chatwoot_rails
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: l1support_chatwoot_secret_change_in_prod
      DATABASE_URL: postgresql://l1support:l1support_secret@postgres:5432/l1_support
      REDIS_URL: redis://redis:6379/1
    command: /bin/sh -c "bundle exec sidekiq -C config/sidekiq.yml"

  # ─── n8n (Workflow Automation) ──────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: l1_n8n
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: l1support
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: l1_support
      DB_POSTGRESDB_USER: l1support
      DB_POSTGRESDB_PASSWORD: l1support_secret
      N8N_HOST: localhost
      N8N_PORT: 5678
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  # ─── OpenTelemetry Collector ─────────────────────────────────────────
  otel_collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: l1_otel
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./docker/otel/config.yaml:/etc/otel/config.yaml
    command: ["--config=/etc/otel/config.yaml"]

  # ─── Prometheus ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: l1_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  # ─── Grafana ─────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: l1_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: l1support
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

  # ─── L1 Support API (our application) ───────────────────────────────
  l1_api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: l1_api
    depends_on:
      falkordb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./data/mempalace:/app/data/mempalace
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  falkordb_data:
  redis_data:
  postgres_data:
  chatwoot_storage:
  n8n_data:
  prometheus_data:
  grafana_data:
