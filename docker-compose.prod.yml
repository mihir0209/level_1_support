version: "3.9"

# Production compose — production-grade resource limits, health checks,
# restart policies, and observability stack.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Environment (set in .env.prod before running):
#   ADMIN_API_KEY=          — strong admin key (required)
#   ANTHROPIC_API_KEY=      — Anthropic API key (required)
#   DATABASE_URL=           — override postgres DSN (optional)
#   REDIS_URL=              — Redis URL (optional)
#   OTEL_EXPORTER_OTLP_ENDPOINT=  — OTLP collector endpoint (optional)
#   ENVIRONMENT=production

x-common-env: &common_env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PYTHONUNBUFFERED: "1"

services:
  # ─── Core Infrastructure ────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: l1_production_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: l1_support
      POSTGRES_USER: ${POSTGRES_USER:-l1support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-l1support} -d l1_support"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    shm_size: 128MB

  redis:
    image: redis:7-alpine
    container_name: l1_production_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_production_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 64M

  falkordb:
    image: falkordb/falkordb:latest
    container_name: l1_production_falkordb
    restart: unless-stopped
    volumes:
      - falkordb_production_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ─── Observability ───────────────────────────────────────────────────

  otel_collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: l1_production_otel
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC
    profiles:
      - observability
    volumes:
      - ./docker/otel/config.yaml:/etc/otel/config.yaml
    command: ["--config=/etc/otel/config.yaml"]
    deploy:
      resources:
        limits:
          memory: 128M

  prometheus:
    image: prom/prometheus:latest
    container_name: l1_production_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_production_data:/prometheus
    profiles:
      - observability
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── L1 Support API ───────────────────────────────────────────────────

  l1_api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: l1_support_api:latest
    container_name: l1_production_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    env_file: .env.prod
    environment:
      <<: *common_env
    ports:
      - "8000:8000"
    volumes:
      - ./data/mempalace:/app/data/mempalace
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    command: >
      sh -c "alembic upgrade head &&
             gunicorn main:app
               --config gunicorn.conf.py
               --bind 0.0.0.0:8000"

networks:
  default:
    name: l1_production_network
    driver: bridge

volumes:
  postgres_production_data:
  redis_production_data:
  falkordb_production_data:
  prometheus_production_data:
