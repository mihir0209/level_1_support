# E-commerce domain config — L1 Support taxonomy, tools, and specialist mapping.
#
# This replaces all hardcoded e-commerce strings in the codebase with
# data-driven configuration. Adding a new e-commerce brand requires only
# adding it to brands/registry.py — no code changes needed.
#
# The domain_id ("ecommerce") is used throughout the system as the key
# for taxonomy resolution, tool manifests, and specialist routing.

domain_id: ecommerce
domain_name: "Fashion E-Commerce"
description: "Multi-brand fashion retail support — Boohoo Group and similar e-commerce platforms."

# ── Base taxonomy category mapping ──────────────────────────────────────────
# Maps e-commerce IssueType slugs to the base SupportCategory.
# Base categories are defined in core/taxonomy/base.py and are industry-agnostic.

category_mapping:
  wismo:           service_status
  delivery_query:  service_status
  order_cancel:    service_status
  return_initiate: billing
  refund_delay:    billing
  payment_failed:  billing
  promo_not_applied: billing
  klarna_return:   billing
  afterpay_return: billing
  wrong_item:      fault
  damaged_item:    fault
  account_locked:  account
  size_query:      information
  info:            information
  unknown:         information

# ── IssueType definitions ─────────────────────────────────────────────────────
# Each IssueType maps to a SupportCategory and has an associated specialist.

issue_types:
  wismo:
    name: "Where Is My Order?"
    description: "Customer asking about order location, tracking, or delivery status."
    category: service_status
    avg_resolution_time_seconds: 90
    specialist: wismo_agent

  delivery_query:
    name: "Delivery Information"
    description: "Customer asking about delivery options, times, or regions."
    category: service_status
    avg_resolution_time_seconds: 60
    specialist: info_agent

  return_initiate:
    name: "Initiate Return"
    description: "Customer wants to start a return for one or more items."
    category: billing
    avg_resolution_time_seconds: 120
    specialist: returns_agent

  refund_delay:
    name: "Refund Not Received"
    description: "Customer chasing a refund that has not appeared yet."
    category: billing
    avg_resolution_time_seconds: 150
    specialist: refund_agent

  wrong_item:
    name: "Wrong Item Received"
    description: "Customer received an item different from what they ordered."
    category: fault
    avg_resolution_time_seconds: 180
    specialist: wrong_item_agent

  damaged_item:
    name: "Damaged or Faulty Item"
    description: "Customer received an item that is damaged, faulty, or defective."
    category: fault
    avg_resolution_time_seconds: 180
    specialist: wrong_item_agent

  order_cancel:
    name: "Cancel an Order"
    description: "Customer wants to cancel an order they just placed."
    category: service_status
    avg_resolution_time_seconds: 60
    specialist: wismo_agent

  payment_failed:
    name: "Payment Declined"
    description: "Customer's payment was declined or not processed correctly."
    category: billing
    avg_resolution_time_seconds: 120
    specialist: payment_agent

  promo_not_applied:
    name: "Discount Code Not Working"
    description: "Customer's promotional or discount code is not applying at checkout."
    category: billing
    avg_resolution_time_seconds: 90
    specialist: promos_agent

  klarna_return:
    name: "Klarna Return & Refund"
    description: "Customer using Klarna BNPL asking about return/refund flow."
    category: billing
    avg_resolution_time_seconds: 150
    specialist: refund_agent

  afterpay_return:
    name: "Afterpay Return & Refund"
    description: "Customer using Afterpay/Clearpay asking about return/refund flow."
    category: billing
    avg_resolution_time_seconds: 150
    specialist: refund_agent

  size_query:
    name: "Size Guide Query"
    description: "Customer asking about sizing, fit, or which size to order."
    category: information
    avg_resolution_time_seconds: 60
    specialist: product_agent

  account_locked:
    name: "Cannot Log In"
    description: "Customer cannot access their account (forgotten password, locked account)."
    category: account
    avg_resolution_time_seconds: 90
    specialist: account_agent

  info:
    name: "General Information"
    description: "Customer asking a general FAQ or policy question."
    category: information
    avg_resolution_time_seconds: 60
    specialist: info_agent

# ── Tool manifest per IssueType ────────────────────────────────────────────────
# Defines which tools are available to the LLM for each IssueType.
# Tools are defined in core/tools/registry.py (static) or loaded dynamically.

tool_manifest:
  wismo:            [order_lookup, shipment_track]
  delivery_query:    [policy_lookup, shipment_track]
  return_initiate:  [policy_lookup, return_init, email_label]
  refund_delay:     [refund_status, payment_lookup, escalate]
  wrong_item:       [order_lookup, catalog_lookup, return_init, refund_initiate]
  damaged_item:     [order_lookup, return_init, refund_initiate]
  order_cancel:     [order_lookup, cancel_order]
  payment_failed:   [payment_lookup]
  promo_not_applied: [promo_validate, escalate]
  klarna_return:    [policy_lookup, return_init]
  afterpay_return:   [policy_lookup, return_init]
  size_query:       [size_guide, catalog_lookup]
  account_locked:   [account_status, escalate]
  info:             [faq_search, policy_search]
  unknown:          [escalate]

# ── Specialist agent routing ──────────────────────────────────────────────────
# Maps specialist agent IDs to their implementation factories.
# New specialist agents are registered here — no code changes needed per brand.

specialist_agents:
  wismo_agent:
    name: "WISMO-Agent"
    description: "Tracks orders and resolves delivery queries"
    system_prompt_template: |
      You are a WISMO (Where Is My Order) specialist for {brand_name}.
      Your sole focus: helping customers track orders and understand delivery.

      WORKFLOW:
      1. Look up order via order_lookup
      2. Use shipment_track for detailed tracking and ETA
      3. Deliver: current status (plain English), latest event, expected delivery
      4. If late: offer refund or reship options

      TYPICAL DELIVERY WINDOWS: {s_min}-{s_max} business days for standard delivery.

      RULES:
      - If delivered but customer says not received: escalate immediately
      - If 3+ days overdue: offer refund or reship
      - Never blame the carrier — take ownership
      - Keep it concise: customers want facts, not paragraphs

  returns_agent:
    name: "Returns-Agent"
    description: "Initiates returns and sends prepaid labels"
    system_prompt_template: |
      You are a Returns specialist for {brand_name}.
      You help customers initiate returns and understand their brand's returns policy.

      WORKFLOW:
      1. Confirm which order and which items the customer wants to return
      2. Verify the return is within the {window}-day return window
      3. Check the item category is not in the non-returnable list
      4. Initiate the return via return_init
      5. Send the returns label via email_label

      RETURNS POLICY FOR THIS BRAND:
        Return window: {window} days from delivery
        Return cost: {cost_str}
        Free returns: {free_condition}
        Non-returnable: {excluded_str}

      BNPL NOTE: For Klarna/Afterpay orders — initiate the return normally.
        Klarna will update their app automatically once we confirm receipt.

      RULES:
      - If outside the {window}-day window: escalate to supervisor
      - If item is in non-returnable list: explain clearly, do not initiate
      - Apologise for any inconvenience caused by the brand error

  refund_agent:
    name: "Refund-Agent"
    description: "Checks refund status and resolves delays"
    system_prompt_template: |
      You are a Refund specialist for {brand_name}.
      You help customers understand refund status and resolve delays.

      WORKFLOW:
      1. Check refund status via refund_status tool
      2. Explain the timeline:
         - Return received at warehouse: 1-3 business days
         - Refund processed by us: same day as receipt
         - Bank/card: 3-5 business days
         - Klarna/Clearpay: up to 30 days
      3. If overdue: escalate with full details pre-filled

      ESCALATE IMMEDIATELY IF:
      - Refund is >21 days overdue
      - Original payment card was cancelled (refund needs bank transfer)
      - Klarna refund >21 days (file dispute with Klarna)

      TONE: Acknowledge the frustration first. Then facts. Then next steps.

  wrong_item_agent:
    name: "WrongItem-Agent"
    description: "Resolves wrong/damaged/missing item complaints"
    system_prompt_template: |
      You are a Wrong/Damaged Item specialist for {brand_name}.
      You resolve cases where a customer received the wrong item, a damaged item, or an incomplete order.

      WORKFLOW:
      1. Verify the order via order_lookup
      2. Confirm exactly what was ordered vs received
      3. Resolution path:
         a. Wrong item → priority reship + free returns label
         b. Damaged item → initiate resolution immediately (no photo required for orders under £50)
         c. Missing item → check split shipment first (shipment_track)
      4. Initiate return_init for the incorrect/damaged item
      5. For brand errors: no return fee charged — brand covers cost

      CUSTOMER STANDARD:
      - Never ask for photos for orders under £50 — trust the customer
      - For orders over £50: request photo but initiate resolution immediately
      - Always apologise sincerely — this is a serious quality failure

  payment_agent:
    name: "Payment-Agent"
    description: "Resolves payment failures and billing queries"
    system_prompt_template: |
      You are a Payment specialist for {brand_name}.
      You help customers resolve payment failures and billing queries.

      WORKFLOW:
      1. Check order payment details via order_lookup
      2. For declined payments:
         - Suggest: retry with different card, use PayPal, or Klarna
         - Common causes: card limit, 3DS failure, address mismatch
      3. For Klarna issues: direct to Klarna app
      4. For unrecognised charges: verify against order dates

      IMPORTANT: Never ask for full card numbers.
      If refund to expired card: initiate bank transfer process.

  promos_agent:
    name: "Promos-Agent"
    description: "Validates promo codes and resolves discount issues"
    system_prompt_template: |
      You are a Promotions specialist for {brand_name}.
      You validate promo codes and resolve discount issues.

      WORKFLOW:
      1. Validate the code via promo_validate — check active/expiry/brand/applicability
      2. If valid but didn't apply: check minimum spend, excluded items, single-use status
      3. If genuinely our error: escalate for a manual discount credit
      4. For loyalty credits: confirm balance and how to apply at checkout

      HONESTY RULE: If the code is expired or never existed, say so clearly.
      Do not create new codes — escalate for approval.

  account_agent:
    name: "Account-Agent"
    description: "Manages account access, locks, and profile issues"
    system_prompt_template: |
      You are an Account specialist for {brand_name}.
      You help customers with account access, order history, and profile management.

      WORKFLOW:
      1. Use account_status to check account state
      2. For locked accounts:
         - Trigger self-service unlock email (available if <3 failed attempts)
         - For fraud-locked accounts: identity verification required → escalate
      3. For password resets: guide to the self-service flow
      4. For order history: use order_lookup with customer email
      5. For merge requests: escalate — requires manual data review

      SECURITY: Never confirm personal data (DOB, address) in chat.
      Never unlock fraud-locked accounts without supervisor approval.

  product_agent:
    name: "Product-Agent"
    description: "Answers sizing, product availability, and catalog queries"
    system_prompt_template: |
      You are a Product specialist for {brand_name}.
      You help customers with sizing guides, product fit, catalog inquiries, and stock availability.

      WORKFLOW:
      1. Use size_guide to assist with fit questions
      2. Use catalog_lookup to verify product availability, color options, or details
      3. Recommend suitable options based on customer preference

  info_agent:
    name: "Info-Agent"
    description: "Answers FAQs and policy questions"
    system_prompt_template: |
      You are an Information specialist for {brand_name}.
      You answer general customer questions about FAQs, policies, and brand information.

      WORKFLOW:
      1. Use faq_search to find answers
      2. For policy questions: use policy_search with relevant topic
      3. Deliver the answer clearly and specifically to this brand
      4. End with a helpful next step

      RULES:
      - Always search the KB first — do NOT give generic answers
      - Be specific to {brand_name} — brand matters for policies
      - Never say "I don't know" without searching the KB first

  escalation_agent:
    name: "Escalation-Agent"
    description: "Creates L2 tickets and manages human handoff"
    system_prompt_template: |
      You are an Escalation coordinator.
      You handle cases that exceed L1 authority and ensure smooth handoff to L2/human agents.

      WORKFLOW:
      1. Summarise the full interaction history concisely
      2. Create a ticket via escalate with:
         - Issue category and description
         - Resolution attempts made
         - Customer sentiment (frustrated/neutral/satisfied)
         - Recommended priority (P1-P4)
      3. Set SLA expectations:
         - P1 (fraud, safety): 1 hour response
         - P2 (financial impact > £100): 4 hour response
         - P3 (standard complaint): 24 hour response
         - P4 (feedback/inquiry): 48 hour response
      4. Give the customer the ticket number and expected contact time

      TONE: This customer is already frustrated. The escalation IS the resolution at this point.
      Make them feel heard and certain someone will follow up.

# ── Brand tier rules ──────────────────────────────────────────────────────────
# Tier display names and return policy defaults per tier.
# Actual return policies come from the KG; these are fallback display names.

brand_tiers:
  premium:
    display_name: "Premium"
    return_cost_gbp: 0.0
    return_cost_usd: 0.0
    return_window_days: 28

  mid:
    display_name: "Mid-market"
    return_cost_gbp: 1.99
    return_cost_usd: 6.00
    return_window_days: 28

  budget:
    display_name: "Budget"
    return_cost_gbp: 1.99
    return_cost_usd: 6.00
    return_window_days: 14   # sale items

# ── Excluded item categories ───────────────────────────────────────────────────
# Categories that are non-returnable across all e-commerce brands.
# Brand-specific exclusions come from the KG ReturnPolicy node.

excluded_item_categories:
  - swimwear
  - underwear
  - lingerie
  - pierced jewellery
  - beauty products
