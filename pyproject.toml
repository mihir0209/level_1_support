[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "l1-support-ai"
version = "0.1.0"
description = "AI-native L1 Customer Support — E-Commerce Edition"
requires-python = ">=3.12"
dependencies = [
    # Graph
    "falkordb>=1.0.0",
    "graphiti-core[anthropic]>=0.10.0",

    # Orchestration
    "langgraph>=0.3.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",

    # Multi-agent
    "swarms>=7.0.0",

    # LLM abstraction
    "litellm>=1.50.0",
    "anthropic>=0.40.0",

    # Memory
    "mempalace>=3.3.0",
    "redis[hiredis]>=5.0.0",

    # Vector search (via pgvector in postgres)
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "psycopg[binary,pool]>=3.1.0",

    # Data pipeline / crawling
    "firecrawl-py>=1.0.0",
    "scrapy>=2.12.0",
    "kafka-python-ng>=2.2.0",

    # API / Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",

    # Validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # Observability
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-exporter-otlp>=1.26.0",
    "langsmith>=0.1.100",
    "prometheus-client>=0.20.0",

    # Utilities
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
voice = [
    "pipecat-ai[daily,deepgram,elevenlabs,anthropic,silero]>=0.0.55",
    "twilio>=9.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["core", "channels", "ingestion", "feedback", "brands"]
